[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-aigc"
version = "0.1.0"
description = "Transformation-robust multi-evidence AI-generated image detector"
requires-python = ">=3.10,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
