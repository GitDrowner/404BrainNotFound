<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">759921 hybrid AIGC detector architecture</title>
  <desc id="desc">Legacy joint-fusion detector with shared DINOv2 global and tile branches, a SigLIP semantic branch, a Haar perturbation similarity signal, final classifier, auxiliary training heads, and an external explanation layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#344054"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#5b6577}.section{font-size:17px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#4c566a}.tiny{font-size:11px;fill:#667085}.box{stroke-width:2;rx:13;filter:url(#shadow)}.edge{fill:none;stroke:#344054;stroke-width:2.3;marker-end:url(#arrow)}.blue-edge{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}.purple-edge{fill:none;stroke:#7c3aed;stroke-width:2.5;marker-end:url(#arrowPurple)}.dashed{stroke-dasharray:8 7}.dim{font-size:11px;fill:#475467;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#f7f9fc"/>
  <text x="55" y="54" class="title">759921 Hybrid AIGC Detector</text>
  <text x="55" y="82" class="subtitle">Actual checkpoint path · legacy joint fusion (not a three-expert MoE) · inference explanation does not modify the architecture</text>

  <rect x="36" y="112" width="1528" height="680" rx="22" fill="#ffffff" stroke="#d7dce5" stroke-width="2"/>
  <text x="58" y="145" class="section">MODEL FORWARD PATH</text>

  <rect class="box" x="62" y="350" width="170" height="105" fill="#e8eef8" stroke="#5373a6"/>
  <text x="147" y="385" text-anchor="middle" class="label">Input image</text>
  <text x="147" y="410" text-anchor="middle" class="small">native RGB</text>
  <text x="147" y="430" text-anchor="middle" class="tiny">one shared source</text>

  <rect class="box" x="285" y="175" width="205" height="94" fill="#eaf2ff" stroke="#3b82f6"/>
  <text x="388" y="208" text-anchor="middle" class="label">Global view</text>
  <text x="388" y="232" text-anchor="middle" class="small">bicubic resize 224×224</text>
  <text x="388" y="251" text-anchor="middle" class="tiny">ImageNet normalization</text>

  <rect class="box" x="285" y="354" width="205" height="105" fill="#eaf2ff" stroke="#3b82f6"/>
  <text x="388" y="385" text-anchor="middle" class="label">Native tiles</text>
  <text x="388" y="409" text-anchor="middle" class="small">4 corner crops · 224×224</text>
  <text x="388" y="430" text-anchor="middle" class="tiny">upscale first if image is small</text>

  <rect class="box" x="285" y="584" width="205" height="94" fill="#f3ebff" stroke="#8b5cf6"/>
  <text x="388" y="617" text-anchor="middle" class="label">Semantic view</text>
  <text x="388" y="641" text-anchor="middle" class="small">bicubic resize 384×384</text>
  <text x="388" y="660" text-anchor="middle" class="tiny">mean/std = 0.5</text>

  <path class="edge" d="M232 382 C255 335 258 240 285 225"/>
  <path class="edge" d="M232 404 L285 404"/>
  <path class="edge" d="M232 430 C257 481 258 612 285 627"/>

  <rect class="box" x="555" y="188" width="238" height="148" fill="#dbeafe" stroke="#2563eb"/>
  <text x="674" y="220" text-anchor="middle" class="label">DINOv2-B/14</text>
  <text x="674" y="245" text-anchor="middle" class="small">shared forensic backbone</text>
  <text x="674" y="270" text-anchor="middle" class="tiny">frozen pretrained base</text>
  <text x="674" y="290" text-anchor="middle" class="tiny">LoRA on QKV · last 4 blocks</text>
  <text x="674" y="315" text-anchor="middle" class="dim">pooled embedding: 768-D</text>

  <path class="blue-edge" d="M490 220 L555 230"/>
  <path class="blue-edge" d="M490 404 C520 404 522 295 555 285"/>
  <text x="510" y="384" class="tiny">shared weights</text>

  <rect class="box" x="840" y="183" width="185" height="88" fill="#edf5ff" stroke="#4b8de8"/>
  <text x="933" y="215" text-anchor="middle" class="label">Global embedding</text>
  <text x="933" y="240" text-anchor="middle" class="dim">768-D</text>
  <path class="blue-edge" d="M793 225 L840 225"/>

  <rect class="box" x="840" y="330" width="185" height="112" fill="#edf5ff" stroke="#4b8de8"/>
  <text x="933" y="360" text-anchor="middle" class="label">Tile embeddings</text>
  <text x="933" y="383" text-anchor="middle" class="small">attention pooling</text>
  <text x="933" y="405" text-anchor="middle" class="dim">4×768 → 768-D</text>
  <text x="933" y="426" text-anchor="middle" class="tiny">+ auxiliary tile logits</text>
  <path class="blue-edge" d="M793 300 C818 310 818 380 840 380"/>

  <rect class="box" x="555" y="576" width="238" height="116" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="674" y="609" text-anchor="middle" class="label">SigLIP SO400M/14</text>
  <text x="674" y="633" text-anchor="middle" class="small">frozen semantic backbone</text>
  <text x="674" y="659" text-anchor="middle" class="dim">pooled embedding: 1152-D</text>
  <path class="purple-edge" d="M490 629 L555 629"/>

  <rect class="box" x="840" y="576" width="185" height="88" fill="#f4efff" stroke="#8b5cf6"/>
  <text x="933" y="608" text-anchor="middle" class="label">Semantic embedding</text>
  <text x="933" y="633" text-anchor="middle" class="dim">1152-D</text>
  <path class="purple-edge" d="M793 620 L840 620"/>

  <rect class="box" x="555" y="390" width="238" height="126" fill="#fff4df" stroke="#e59a16"/>
  <text x="674" y="421" text-anchor="middle" class="label">Haar-like perturbation</text>
  <text x="674" y="445" text-anchor="middle" class="small">global view → local HF boost</text>
  <text x="674" y="468" text-anchor="middle" class="small">shared DINOv2 forward</text>
  <text x="674" y="492" text-anchor="middle" class="dim">cos(original, perturbed): 1-D</text>
  <path class="edge" d="M490 245 C525 270 520 430 555 438"/>

  <rect class="box" x="1090" y="284" width="220" height="202" fill="#e8faf1" stroke="#1d9a63"/>
  <text x="1200" y="319" text-anchor="middle" class="label">Joint fusion</text>
  <text x="1200" y="346" text-anchor="middle" class="small">concatenate four signals</text>
  <line x1="1114" y1="365" x2="1286" y2="365" stroke="#91cbb0"/>
  <text x="1200" y="390" text-anchor="middle" class="tiny">global 768</text>
  <text x="1200" y="412" text-anchor="middle" class="tiny">tile-pooled 768</text>
  <text x="1200" y="434" text-anchor="middle" class="tiny">semantic 1152</text>
  <text x="1200" y="456" text-anchor="middle" class="tiny">wavelet similarity 1</text>
  <path class="edge" d="M1025 225 C1060 225 1054 332 1090 340"/>
  <path class="edge" d="M1025 386 L1090 386"/>
  <path class="edge" d="M1025 620 C1060 620 1054 455 1090 448"/>
  <path class="edge" d="M793 472 C940 520 1015 438 1090 428"/>

  <rect class="box" x="1360" y="304" width="168" height="92" fill="#e8faf1" stroke="#1d9a63"/>
  <text x="1444" y="334" text-anchor="middle" class="label">Fusion MLP</text>
  <text x="1444" y="357" text-anchor="middle" class="small">LayerNorm → Linear</text>
  <text x="1444" y="378" text-anchor="middle" class="dim">GELU · dropout · 512-D</text>
  <path class="edge" d="M1310 370 L1360 350"/>

  <rect class="box" x="1360" y="438" width="168" height="92" fill="#ffe9ec" stroke="#d1495b"/>
  <text x="1444" y="469" text-anchor="middle" class="label">Binary classifier</text>
  <text x="1444" y="493" text-anchor="middle" class="small">FP32 raw logit</text>
  <text x="1444" y="514" text-anchor="middle" class="dim">sigmoid → confidence</text>
  <path class="edge" d="M1444 396 L1444 438"/>

  <rect x="1090" y="555" width="438" height="150" rx="14" fill="#f8fafc" stroke="#98a2b3" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="1112" y="584" class="label">Training / diagnostic auxiliary heads</text>
  <text x="1112" y="612" class="small">• degradation classifier: 8 classes</text>
  <text x="1112" y="637" class="small">• degradation severity regressor</text>
  <text x="1112" y="662" class="small">• global consistency head</text>
  <text x="1112" y="687" class="tiny">These heads do not replace the binary classifier at inference.</text>
  <path class="edge dashed" d="M1360 365 C1320 480 1315 535 1310 555"/>

  <rect x="36" y="815" width="1528" height="198" rx="22" fill="#f0f7ff" stroke="#68a3dc" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="58" y="848" class="section">EXPLANATION LAYER — INFERENCE-ONLY, OUTSIDE THE MODEL</text>
  <rect x="70" y="875" width="310" height="98" rx="12" fill="#ffffff" stroke="#68a3dc"/>
  <text x="225" y="905" text-anchor="middle" class="label">Hierarchical region occlusion</text>
  <text x="225" y="930" text-anchor="middle" class="small">coarse grid → top-K local refinement</text>
  <text x="225" y="952" text-anchor="middle" class="tiny">raw-logit + probability deltas</text>
  <rect x="420" y="875" width="330" height="98" rx="12" fill="#ffffff" stroke="#68a3dc"/>
  <text x="585" y="905" text-anchor="middle" class="label">Input high-frequency strength</text>
  <text x="585" y="930" text-anchor="middle" class="small">|image − GaussianBlur(image)|</text>
  <text x="585" y="952" text-anchor="middle" class="tiny">checkpoint-independent diagnostic</text>
  <rect x="790" y="875" width="360" height="98" rx="12" fill="#ffffff" stroke="#68a3dc"/>
  <text x="970" y="905" text-anchor="middle" class="label">Wavelet-only model counterfactual</text>
  <text x="970" y="930" text-anchor="middle" class="small">locally suppress HF; fix all other fusion features</text>
  <text x="970" y="952" text-anchor="middle" class="tiny">only real wavelet_similarity may change</text>
  <rect x="1190" y="875" width="330" height="98" rx="12" fill="#ffffff" stroke="#68a3dc"/>
  <text x="1355" y="905" text-anchor="middle" class="label">Robustness trajectory</text>
  <text x="1355" y="930" text-anchor="middle" class="small">16 prescribed transform conditions</text>
  <text x="1355" y="952" text-anchor="middle" class="tiny">JPEG · blur · resize · noise · color · crop</text>
</svg>
