seed: 20260829
output_dir: outputs/hybrid_759921_uncertainty_h100

data:
  train_manifest: data/fusion_v2/manifests/train.jsonl
  val_manifest: data/fusion_v2/manifests/validation.jsonl
  test_manifest: data/fusion_v2/manifests/test.jsonl
  image_size: 224
  semantic_image_size: 384
  num_tiles: 4
  batch_size: 192
  num_workers: 16
  max_train_samples: null
  max_val_samples: null
  max_test_samples: null
  clean_probability: 0.20
  compound_probability: 0.40
  balanced_sampler: true

# Architecture is intentionally identical to job 759921. Do not add MoE experts.
model:
  forensic_backbone: vit_base_patch14_dinov2.lvd142m
  semantic_backbone: vit_so400m_patch14_siglip_384.webli
  pretrained: true
  freeze_forensic: true
  freeze_semantic: true
  lora_last_blocks: 4
  lora_rank: 8
  lora_alpha: 16
  hidden_dim: 512
  dropout: 0.22
  use_semantic_branch: true
  use_wavelet_branch: true
  degradation_classes: 8

train:
  initial_checkpoint: checkpoint/best.pt
  epochs: 4
  head_warmup_epochs: 0
  learning_rate: 0.00015
  lora_learning_rate: 0.00003
  weight_decay: 0.05
  warmup_ratio: 0.05
  gradient_accumulation: 1
  gradient_clip: 1.0
  amp: bf16
  compile: false
  log_every: 20
  save_every_epoch: true
  early_stopping_patience: 2

# The primary GroupDRO classification objective is fixed at 1.0. Every auxiliary
# loss from 759921 gets its own learned uncertainty weight.
loss:
  mode: uncertainty
  classification_anchor: 1.0
  learning_rate: 0.002
  warmup_ratio: 0.10
  min_log_variance: -3.0
  max_log_variance: 3.0
  groups:
    consistency:
      terms: [consistency]
      initial_weight: 0.35
    feature_consistency:
      terms: [feature_consistency]
      initial_weight: 0.10
    degradation_classification:
      terms: [degradation_classification]
      initial_weight: 0.20
    degradation_severity:
      terms: [degradation_severity]
      initial_weight: 0.10
    tile_auxiliary:
      terms: [tile_auxiliary]
      initial_weight: 0.15

robust_optimization:
  enabled: true
  include_degradation: false
  eta: 0.05
  hard_fraction: 0.25
  hard_weight: 0.25
  class_balance_weight: 0.20

evaluation:
  threshold: 0.5
  fixed_threshold: true
  evaluate_test_each_epoch: false
  selection_metric: worst_class_recall
  confidence: calibrated_probability_fake
