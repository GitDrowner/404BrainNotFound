seed: 20260826
output_dir: outputs/hybrid_groupdro_h100
data:
  train_manifest: data/hybrid_groupdro/manifests/train.jsonl
  val_manifest: data/hybrid_groupdro/manifests/validation.jsonl
  test_manifest: data/hybrid_groupdro/manifests/test_general.jsonl
  image_size: 224
  semantic_image_size: 384
  num_tiles: 4
  batch_size: 192
  num_workers: 16
  max_train_samples: null
  max_val_samples: null
  max_test_samples: null
  clean_probability: 0.2
  compound_probability: 0.35
  balanced_sampler: true
model:
  forensic_backbone: vit_base_patch14_dinov2.lvd142m
  semantic_backbone: vit_so400m_patch14_siglip_384.webli
  pretrained: true
  freeze_forensic: true
  freeze_semantic: true
  lora_last_blocks: 4
  lora_rank: 8
  lora_alpha: 16
  hidden_dim: 512
  dropout: 0.22
  use_semantic_branch: true
  use_wavelet_branch: true
  degradation_classes: 8
train:
  initial_checkpoint: outputs/trace_h100/best.pt
  epochs: 4
  head_warmup_epochs: 0
  learning_rate: 0.00015
  lora_learning_rate: 3.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.05
  gradient_accumulation: 1
  gradient_clip: 1.0
  amp: bf16
  compile: false
  log_every: 20
  save_every_epoch: true
  early_stopping_patience: 2
loss:
  classification: 1.2
  consistency: 0.35
  feature_consistency: 0.1
  degradation_classification: 0.2
  degradation_severity: 0.1
  tile_auxiliary: 0.15
robust_optimization:
  enabled: true
  eta: 0.05
  hard_fraction: 0.25
  hard_weight: 0.25
  class_balance_weight: 0.2
evaluation:
  threshold: 0.5
  fixed_threshold: true
  evaluate_test_each_epoch: false
  selection_metric: worst_class_recall
